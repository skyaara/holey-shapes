<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">Perforated disc</title><desc id="desc">A violet solid disc punched through with four irregular voids.</desc>
  <defs>
    <circle id="body" cx="210" cy="202" r="164"/>
    <g id="holes"><ellipse cx="143" cy="139" rx="29" ry="39" transform="rotate(-29 143 139)"/><ellipse cx="262" cy="120" rx="38" ry="26" transform="rotate(17 262 120)"/><ellipse cx="287" cy="245" rx="29" ry="41" transform="rotate(36 287 245)"/><ellipse cx="151" cy="278" rx="37" ry="25" transform="rotate(14 151 278)"/></g>
    <mask id="frontMask"><rect width="420" height="420" fill="white"/><use href="#holes" fill="black"/></mask>
    <mask id="backMask"><rect width="420" height="420" fill="white"/><ellipse cx="143" cy="139" rx="20" ry="28" transform="rotate(-29 143 139)" fill="black"/><ellipse cx="262" cy="120" rx="27" ry="18" transform="rotate(17 262 120)" fill="black"/><ellipse cx="287" cy="245" rx="20" ry="30" transform="rotate(36 287 245)" fill="black"/><ellipse cx="151" cy="278" rx="26" ry="17" transform="rotate(14 151 278)" fill="black"/></mask>
  </defs>
  <g id="sculpture" transform="rotate(-7 210 210)">
    <use href="#body" fill="#6337FF" mask="url(#frontMask)"/>
  </g>
</svg>

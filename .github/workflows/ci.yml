name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm test
        working-directory: packages/js
      - run: npm pack --dry-run
        working-directory: packages/js
      - name: Check the seeding vectors are up to date
        run: node scripts/seeding-vectors.mjs && git diff --exit-code packages/seeding-vectors.tsv

  swift:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift run --package-path packages/swift/Verification -c release Verify "$RUNNER_TEMP/swift-layouts.json"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :core:verifyPacking test
        working-directory: packages/android

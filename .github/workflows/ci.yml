name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm test
        working-directory: packages/js
      - run: npm pack --dry-run
        working-directory: packages/js
      - name: Check the seeding vectors are up to date
        run: node scripts/seeding-vectors.mjs && git diff --exit-code packages/seeding-vectors.tsv

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Check the Rust fixtures are up to date
        working-directory: .
        run: node scripts/rust-fixtures.mjs && git diff --exit-code packages/rust/tests/fixtures
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: Test the oldest supported Rust
        run: |
          rustup toolchain install 1.79 --profile minimal
          cargo +1.79 test --release
      - run: cargo package

  swift:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift run --package-path packages/swift/Verification -c release Verify "$RUNNER_TEMP/swift-layouts.json"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :core:verifyPacking test
        working-directory: packages/android

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Holey Shapes" />
    <meta name="author" content="Aakash Reddy" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="description"
      content="Create perforated SVG shapes, adjust their holes and colors, add a solid extrusion, then download the animated result."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Holey Shapes" />
    <meta property="og:title" content="Holey Shapes | Perforated SVG generator" />
    <meta property="og:description" content="Create and download perforated SVG shapes whose holes close and reopen on hover." />
    <meta property="og:url" content="https://holey-shapes.aakashreddy.com/" />
    <meta property="og:image" content="https://holey-shapes.aakashreddy.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Three large rotated perforated shapes staggered across a black background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Holey Shapes | Perforated SVG generator" />
    <meta name="twitter:description" content="Create and download perforated SVG shapes whose holes close and reopen on hover." />
    <meta name="twitter:image" content="https://holey-shapes.aakashreddy.com/og-image.png" />
    <meta name="twitter:image:alt" content="Three large rotated perforated shapes staggered across a black background" />
    <title>Holey Shapes | Perforated SVG generator</title>
    <link rel="canonical" href="https://holey-shapes.aakashreddy.com/" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/marketing.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Holey Shapes",
        "description": "Create and download animated perforated SVG shapes with configurable holes, colors, and solid extrusion.",
        "url": "https://holey-shapes.aakashreddy.com/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "softwareVersion": "2.0.0",
        "isAccessibleForFree": true,
        "image": "https://holey-shapes.aakashreddy.com/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Aakash Reddy",
          "url": "https://github.com/skyaara"
        },
        "sameAs": [
          "https://www.npmjs.com/package/holey-shapes",
          "https://github.com/skyaara/holey-shapes"
        ]
      }
    </script>
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Holey Shapes home"><img src="/logo.svg" width="28" height="28" alt="" /><span>holey shapes</span></a>
      <nav aria-label="Main navigation"><a href="/showcase">Showcase</a><a href="/#customize">Customize</a></nav>
    </header>
    <main>
      <h1 class="sr-only">Holey Shapes</h1>
      <section class="hero" aria-label="Holey Shapes, an interactive collection">
        <div class="hero-field">
          <button type="button" class="hero-art" aria-label="Spin flower-star" style="--rotation:-16deg"><span class="hero-drift" data-shape="flower-star" data-color="#FF0878"></span></button>
          <button type="button" class="hero-art" aria-label="Spin disc" style="--rotation:9deg"><span class="hero-drift" data-shape="disc" data-color="#6337FF"></span></button>
          <button type="button" class="hero-art" aria-label="Spin round-block" style="--rotation:16deg"><span class="hero-drift" data-shape="round-block" data-color="#B5F024"></span></button>
          <button type="button" class="hero-art" aria-label="Spin capsule" style="--rotation:-22deg"><span class="hero-drift" data-shape="capsule" data-color="#FF762D"></span></button>
          <button type="button" class="hero-art" aria-label="Spin cross" style="--rotation:12deg"><span class="hero-drift" data-shape="cross" data-color="#26C8F4"></span></button>
          <button type="button" class="hero-art" aria-label="Spin hex" style="--rotation:8deg"><span class="hero-drift" data-shape="hex" data-color="#FF0878"></span></button>
          <button type="button" class="hero-art" aria-label="Spin diamond" style="--rotation:-14deg"><span class="hero-drift" data-shape="diamond" data-color="#FFD000"></span></button>
          <button type="button" class="hero-art" aria-label="Spin sunburst" style="--rotation:10deg"><span class="hero-drift" data-shape="sunburst" data-color="#B94CFF"></span></button>
          <button type="button" class="hero-art" aria-label="Spin bowtie" style="--rotation:-12deg"><span class="hero-drift" data-shape="bowtie" data-color="#00D7B9"></span></button>
          <button type="button" class="hero-art" aria-label="Spin prism" style="--rotation:18deg"><span class="hero-drift" data-shape="prism" data-color="#2878FF"></span></button>
        </div>
        <div class="hero-bottom"><button class="quiet-button" id="shuffle-hero" aria-label="Shuffle Holey layouts">Shuffle ↻</button><a href="/showcase">Explore the Holeys</a></div>
      </section>
      <section class="customizer" id="customize" aria-labelledby="customize-title">
        <div class="section-heading"><h2 id="customize-title">Make it yours.</h2><span>01 / Customize</span></div>
        <div class="studio">
          <div class="preview-panel"><div id="custom-preview"></div><div class="preview-toolbar"><button id="shuffle" type="button">Shuffle ↻</button><button id="download" type="button">Download SVG ↓</button></div></div>
          <form id="custom-controls" class="controls">
            <fieldset><legend>Shape</legend><div id="shape-picker" class="shape-picker"></div></fieldset>
            <div class="color-row"><label>Face <input type="color" name="color" value="#B5F024" /></label><label>Depth <input type="color" name="shadowColor" value="#506A10" /></label></div>
            <label class="range-label" for="holes">Holes <output for="holes">5</output></label><input id="holes" name="holes" type="range" min="0" max="8" value="5" />
            <div class="toggle-row"><label for="animated">Animate holes</label><input id="animated" name="animated" type="checkbox" checked /></div>
            <details><summary>More options <span>+</span></summary><div class="advanced">
              <label class="range-label" for="duration">Duration <output for="duration">900 ms</output></label><input id="duration" name="duration" type="range" min="100" max="10000" step="100" value="900" />
              <label class="range-label" for="shadowX">Depth X <output for="shadowX">18</output></label><input id="shadowX" name="shadowX" type="range" min="-80" max="80" value="18" />
              <label class="range-label" for="shadowY">Depth Y <output for="shadowY">21</output></label><input id="shadowY" name="shadowY" type="range" min="-80" max="80" value="21" />
              <label class="range-label" for="shadowSteps">Depth steps <output for="shadowSteps">12</output></label><input id="shadowSteps" name="shadowSteps" type="range" min="1" max="32" value="12" />
              <label class="seed-label" for="seed">Seed <input id="seed" name="seed" type="number" min="-1000000" max="1000000" value="0" /></label>
            </div></details>
          </form>
        </div>
      </section>
    </main>
    <footer class="site-footer"><a href="/" class="brand">holey shapes</a><div><a href="https://www.npmjs.com/package/holey-shapes">npm <strong>v2.0.0</strong></a><a href="https://github.com/skyaara/holey-shapes">GitHub</a></div></footer>
    <script type="module" src="/marketing.js"></script>
  </body>
</html>

<!doctype html>
<meta charset="utf-8">
<title>Hole packing browser checks</title>
<pre id="result">Running…</pre>
<script type="module">
import { createHoleySvg, shapeNames } from '../script.js';
const context = document.createElement('canvas').getContext('2d');
const result = document.querySelector('#result');
let checked = 0, worstAreaRatio = 1, minGap = Infinity, slowestMs = 0;
const failures = [];
window.packingOutputs = [];
const directions = Array.from({length:720}, (_,i) => ({x:Math.cos(i*Math.PI/360), y:Math.sin(i*Math.PI/360)}));
for (const {key} of shapeNames) {
  for (let count = 0; count <= 8; count++) for (const seed of [0,1,7,42,-19]) {
    const start = performance.now();
    const source = createHoleySvg({shape:key, holes:count, seed, animated:false});
    window.packingOutputs.push({options:{shape:key, holes:count, seed, animated:false}, source});
    slowestMs = Math.max(slowestMs, performance.now()-start);
    const svg = new DOMParser().parseFromString(source, 'image/svg+xml');
    const path = new Path2D(svg.querySelector('g > path').getAttribute('d'));
    const holes = [...svg.querySelectorAll('ellipse')].map(e => {
      const angle = Number(e.getAttribute('transform')?.match(/rotate\(([-\d.]+)/)?.[1] ?? 0) * Math.PI/180;
      return {x:+e.getAttribute('cx'), y:+e.getAttribute('cy'), a:+e.getAttribute('rx'), b:+e.getAttribute('ry'), c:Math.cos(angle), s:Math.sin(angle)};
    });
    const label = `${key}/${count}/${seed}`;
    if (holes.length !== count) failures.push(`${label}: count`);
    const areas = holes.map(h=>h.a*h.b);
    if (areas.length) {
      const ratio = Math.max(...areas)/Math.min(...areas);
      worstAreaRatio = Math.max(worstAreaRatio, ratio);
      if (!Number.isFinite(ratio) || ratio>1.001) failures.push(`${label}: unequal or invalid area`);
    }
    for (let i=0;i<holes.length;i++) {
      const h = holes[i];
      // Dense offset-perimeter check, independent of the optimizer's 48 samples.
      for (const n of directions) {
        const nx=n.x/h.a, ny=n.y/h.b, len=Math.hypot(nx,ny);
        const x=h.x+h.a*n.x*h.c-h.b*n.y*h.s+11.5*(nx*h.c-ny*h.s)/len;
        const y=h.y+h.a*n.x*h.s+h.b*n.y*h.c+11.5*(nx*h.s+ny*h.c)/len;
        if(!context.isPointInPath(path,x,y)) {failures.push(`${label}: outer rim`);break;}
      }
      for(let j=0;j<i;j++) {
        const other=holes[j];
        const support=(e,n)=>Math.hypot(e.a*(n.x*e.c+n.y*e.s),e.b*(-n.x*e.s+n.y*e.c));
        const gap=Math.max(...directions.map(n=>Math.abs((h.x-other.x)*n.x+(h.y-other.y)*n.y)-support(h,n)-support(other,n)));
        minGap=Math.min(minGap,gap);
        if(gap<11.9) failures.push(`${label}: hole gap ${gap}`);
      }
    }
    checked++;
  }
  result.textContent=JSON.stringify({status:'running',checked,failures},null,2);
  await new Promise(resolve=>setTimeout(resolve,0));
}
result.textContent=JSON.stringify({status:failures.length?'failed':'passed',checked,worstAreaRatio,minGap,slowestMs,failures},null,2);
</script>
